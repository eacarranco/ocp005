name: Deploy Production

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -v -X POST \
            -d "token=${{ secrets.DEPLOY_TOKEN }}" \
            --connect-timeout 10 \
            --max-time 30 \
            https://pagos.rpcayambe.gob.ec/deploy-hook.php 2>&1
