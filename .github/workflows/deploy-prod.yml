name: Deploy Production

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy webhook
        run: |
          curl -s -X POST \
            -d "token=${{ secrets.DEPLOY_TOKEN }}" \
            https://pagos.rpcayambe.gob.ec/deploy-hook.php
